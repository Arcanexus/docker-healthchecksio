name: Keep Workflows Alive

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for wf in docker-publish.yml tests.yml; do
            gh workflow enable "$wf"
          done
