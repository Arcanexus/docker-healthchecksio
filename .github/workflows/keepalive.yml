name: Keep Workflows Alive

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Keep scheduled workflows enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in keepalive.yml docker-publish.yml tests.yml; do
            endpoint="repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}"
            state=$(gh api "$endpoint" --jq .state)
            case "$state" in
              active|disabled_inactivity)
                gh api --method PUT "$endpoint/enable"
                ;;
              *)
                echo "Skipping $workflow (state: $state)"
                ;;
            esac
          done
